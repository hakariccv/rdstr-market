<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RDSTR Market</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #131822;
      --border: #1f2736;
      --accent: #0098ea;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --star-color: #ffb800;
      --ton-color: #0098ea;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 14px; -webkit-tap-highlight-color: transparent; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand { font-size: 19px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
    .brand span { color: var(--accent); }
    .security-badge { font-size: 11px; background: rgba(16, 185, 129, 0.12); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.25); padding: 4px 10px; border-radius: 20px; font-weight: 700; }

    .rate-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); }
    .rate-bar b { color: var(--text-main); }

    .controls-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 150px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 13px; outline: none; }
    
    .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); border-radius: 10px; padding: 0 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); }

    .filters-panel { display: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; gap: 8px; flex-direction: column; }
    .filters-panel.show { display: flex; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .filter-group select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; color: #fff; font-size: 13px; outline: none; }

    .currency-switch { display: flex; gap: 8px; margin-bottom: 14px; }
    .curr-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
    .curr-btn.active { background: rgba(0, 152, 234, 0.15); color: #fff; border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .item-img-wrap { width: 100%; aspect-ratio: 1 / 1; background: radial-gradient(circle at top left, #2a3546, #0f131c); position: relative; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .serial-tag { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 6px; }
    .status-tag { position: absolute; bottom: 8px; left: 8px; font-size: 9px; font-weight: 700; padding: 3px 6px; border-radius: 6px; text-transform: uppercase; }
    .status-sale { background: rgba(16, 185, 129, 0.9); color: #fff; }
    .status-auction { background: rgba(245, 158, 11, 0.9); color: #fff; }
    .status-sold { background: rgba(239, 68, 68, 0.9); color: #fff; }

    .item-body { padding: 10px; display: flex; flex-direction: column; flex: 1; }
    .item-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .item-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .item-price-wrap { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
    .price-ton { color: var(--ton-color); font-weight: 800; font-size: 13px; }
    .price-stars { color: var(--star-color); font-weight: 700; font-size: 11px; }
    .buy-btn { margin-top: 8px; width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 0; font-weight: 700; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="brand">RDSTR <span>MARKET</span></div>
    <div class="security-badge">🛡 TON SECURITY</div>
  </header>

  <div class="rate-bar">
    <span>Курс TON: <b id="tonRateText">$5.20</b></span>
    <span>1 Star ≈ <b>$0.015</b></span>
  </div>

  <div class="controls-row">
    <input type="text" id="searchInput" class="search-box" placeholder="Поиск (напр. Snoop, #123)...">
    <button class="filter-btn" id="filterToggleBtn" onclick="toggleFilters()">⚙️ Фильтры</button>
  </div>

  <div class="filters-panel" id="filtersPanel">
    <div class="filter-group">
      <label>Сортировка по цене</label>
      <select id="sortSelect" onchange="renderGrid()">
        <option value="asc">Сначала дешевые</option>
        <option value="desc">Сначала дорогие</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Статус продажи</label>
      <select id="statusSelect" onchange="renderGrid()">
        <option value="all">Все статусы</option>
        <option value="sale">На продаже</option>
        <option value="auction">Аукцион</option>
        <option value="sold">Продано</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Коллекция</label>
      <select id="collectionSelect" onchange="renderGrid()">
        <option value="all">Все коллекции</option>
        <option value="Snoop Cigar">Snoop Cigar</option>
        <option value="Lol Pop">Lol Pop</option>
        <option value="Party Sparkler">Party Sparkler</option>
        <option value="Desk Calendar">Desk Calendar</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Фон (Backdrop)</label>
      <select id="backdropSelect" onchange="renderGrid()">
        <option value="all">Любой фон</option>
        <option value="Red">Red</option>
        <option value="Blue">Blue</option>
        <option value="Gold">Gold</option>
        <option value="Dark">Dark</option>
      </select>
    </div>
  </div>

  <div class="currency-switch">
    <div class="curr-btn active" id="btn-all" onclick="setCurrency('all')">TON + Звёзды</div>
    <div class="curr-btn" id="btn-ton" onclick="setCurrency('ton')">Только TON</div>
    <div class="curr-btn" id="btn-stars" onclick="setCurrency('stars')">Только Звёзды</div>
  </div>

  <div class="grid" id="itemsGrid"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const tonUsdRate = 5.20;
    const starUsdRate = 0.015;
    let currentCurrency = 'all';

    // Базовые данные для генерации огромного каталога
    const collections = [
      { name: "Snoop Cigar", emoji: "🚬" }, { name: "Lol Pop", emoji: "🍭" },
      { name: "Party Sparkler", emoji: "✨" }, { name: "Desk Calendar", emoji: "📅" }
    ];
    const backdrops = ["Red", "Blue", "Gold", "Dark"];
    const patterns = ["Stars", "Stripes", "Waves", "None"];
    const statuses = ["sale", "auction", "sold"];

    let allGifts = [];

    // Генерируем 150 рандомных подарков для витрины
    function generateMockData() {
      for (let i = 1; i <= 150; i++) {
        const col = collections[Math.floor(Math.random() * collections.length)];
        const tonPrice = parseFloat((Math.random() * 50 + 2).toFixed(1));
        allGifts.push({
          id: i,
          name: col.name,
          emoji: col.emoji,
          num: "#" + Math.floor(Math.random() * 500000 + 1000),
          ton: tonPrice,
          stars: Math.round((tonPrice * tonUsdRate) / starUsdRate),
          status: statuses[Math.floor(Math.random() * statuses.length)],
          backdrop: backdrops[Math.floor(Math.random() * backdrops.length)],
          pattern: patterns[Math.floor(Math.random() * patterns.length)]
        });
      }
    }

    function toggleFilters() {
      const panel = document.getElementById('filtersPanel');
      const btn = document.getElementById('filterToggleBtn');
      panel.classList.toggle('show');
      btn.classList.toggle('active');
    }

    function setCurrency(mode) {
      currentCurrency = mode;
      document.querySelectorAll('.curr-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + mode).classList.add('active');
      renderGrid();
    }

    function renderGrid() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const sort = document.getElementById("sortSelect").value;
      const status = document.getElementById("statusSelect").value;
      const collection = document.getElementById("collectionSelect").value;
      const backdrop = document.getElementById("backdropSelect").value;

      let filtered = allGifts.filter(g => {
        const matchQ = g.name.toLowerCase().includes(q) || g.num.includes(q);
        const matchStatus = status === 'all' || g.status === status;
        const matchCol = collection === 'all' || g.name === collection;
        const matchBg = backdrop === 'all' || g.backdrop === backdrop;
        return matchQ && matchStatus && matchCol && matchBg;
      });

      filtered.sort((a, b) => sort === 'asc' ? a.ton - b.ton : b.ton - a.ton);

      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = "";

      filtered.forEach(g => {
        let statusHtml = '';
        if(g.status === 'sale') statusHtml = '<div class="status-tag status-sale">На продаже</div>';
        if(g.status === 'auction') statusHtml = '<div class="status-tag status-auction">Аукцион</div>';
        if(g.status === 'sold') statusHtml = '<div class="status-tag status-sold">Продано</div>';

        let priceHtml = "";
        if (currentCurrency === 'all') {
          priceHtml = `<div class="price-ton">💎 ${g.ton}</div><div class="price-stars">⭐️ ${g.stars.toLocaleString()}</div>`;
        } else if (currentCurrency === 'ton') {
          priceHtml = `<div class="price-ton">💎 ${g.ton} TON</div>`;
        } else {
          priceHtml = `<div class="price-stars">⭐️ ${g.stars.toLocaleString()} Звёзд</div>`;
        }

        const btnText = g.status === 'sold' ? 'Посмотреть' : 'Купить / Оффер';

        grid.innerHTML += `
          <div class="item-card">
            <div class="item-img-wrap">
              ${g.emoji}
              <div class="serial-tag">${g.num}</div>
              ${statusHtml}
            </div>
            <div class="item-body">
              <div class="item-title">${g.name}</div>
              <div class="item-sub">Bg: ${g.backdrop} | Pt: ${g.pattern}</div>
              <div class="item-price-wrap">${priceHtml}</div>
              <button class="buy-btn" onclick="tg.openTelegramLink('https://t.me/nft')">${btnText}</button>
            </div>
          </div>
        `;
      });
    }

    document.getElementById("searchInput").addEventListener("input", renderGrid);
    
    generateMockData();
    renderGrid();
  </script>
</body>
</html>
