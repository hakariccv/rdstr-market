<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RDSTR Market</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0e1621;
      --card-bg: #17212b;
      --border: #242f3d;
      --accent: #2ea6ff;
      --text-main: #f5f5f5;
      --text-muted: #7f91a4;
      --star: #ffb800;
      --ton: #2ea6ff;
      --green: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Roboto", sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 16px; padding-bottom: 40px; -webkit-tap-highlight-color: transparent; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .brand span { color: var(--accent); }
    .security-badge { font-size: 11px; background: rgba(16, 185, 129, 0.1); color: var(--green); padding: 4px 10px; border-radius: 20px; font-weight: 700; border: 1px solid rgba(16, 185, 129, 0.2); }

    /* Stats */
    .rate-bar { display: flex; justify-content: space-between; background: var(--card-bg); border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px; margin-bottom: 16px; font-size: 13px; color: var(--text-muted); }
    .rate-bar b { color: var(--text-main); font-weight: 600; }

    /* Search & Filters */
    .controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 200px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; color: #fff; font-size: 14px; outline: none; transition: 0.2s; }
    .search-box:focus { border-color: var(--accent); }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); border-radius: 12px; padding: 0 16px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); }

    /* Filter Panel */
    .filters-panel { display: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; gap: 12px; flex-direction: column; }
    .filters-panel.show { display: flex; }
    .filter-row { display: flex; gap: 10px; }
    .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .filter-group label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .filter-group select { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: #fff; font-size: 13px; outline: none; -webkit-appearance: none; }

    /* Currency Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--card-bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .tab { flex: 1; padding: 10px; border-radius: 10px; color: var(--text-muted); font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.2s; }
    .tab.active { background: var(--bg); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    /* Grid */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.1s; }
    .item-card:active { transform: scale(0.98); }
    .item-img-wrap { width: 100%; aspect-ratio: 1/1; position: relative; background: radial-gradient(circle at top, #242f3d, #0e1621); padding: 15px; display: flex; align-items: center; justify-content: center; }
    .item-img-wrap img { width: 85%; height: 85%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
    
    .badge-serial { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .badge-status { position: absolute; bottom: 10px; left: 10px; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
    .bg-sale { background: var(--green); color: #fff; }
    .bg-auction { background: #f59e0b; color: #fff; }

    .item-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }
    .item-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-attrs { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; display: flex; gap: 6px; }
    .item-attrs span { background: var(--bg); padding: 3px 6px; border-radius: 4px; }

    .item-price { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
    .p-ton { color: var(--ton); font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 4px; }
    .p-star { color: var(--star); font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 4px; }
    
    .buy-btn { margin-top: 12px; width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 0; font-weight: 700; font-size: 13px; cursor: pointer; }

    /* Pagination */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
    .page-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand">RDSTR <span>MARKET</span></div>
    <div class="security-badge">🛡 TON SECURED</div>
  </header>

  <div class="rate-bar">
    <span>Курс TON: <b id="tonRateText">$5.20</b></span>
    <span>1 Star ≈ <b>$0.015</b></span>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="Поиск подарка или #номера...">
    <button class="filter-btn" id="filterToggle" onclick="toggleFilters()">⚙️ Фильтры</button>
  </div>

  <div class="filters-panel" id="filtersPanel">
    <div class="filter-row">
      <div class="filter-group">
        <label>Сортировка</label>
        <select id="sortSelect" onchange="applyFilters()">
          <option value="desc">Сначала дорогие</option>
          <option value="asc">Сначала дешевые</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Коллекция</label>
        <select id="collectionSelect" onchange="applyFilters()">
          <option value="all">Все подарки</option>
          <option value="Snoop Cigar">Snoop Cigar</option>
          <option value="Party Sparkler">Party Sparkler</option>
          <option value="Lol Pop">Lol Pop</option>
          <option value="Desk Calendar">Desk Calendar</option>
        </select>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-all" onclick="setCurrency('all')">Все цены</div>
    <div class="tab" id="tab-ton" onclick="setCurrency('ton')">💎 TON</div>
    <div class="tab" id="tab-stars" onclick="setCurrency('stars')">⭐️ Stars</div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="pagination" id="pagination"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    const tonUsdRate = 5.20;
    const starUsdRate = 0.015;
    let currentCurrency = 'all';
    
    // Pagination settings
    let currentPage = 1;
    const itemsPerPage = 10;
    let allGifts = [];
    let filteredGifts = [];

    // Реалистичные ассеты для генерации
    const collections = [
      { name: "Snoop Cigar", img: "https://em-content.zobj.net/source/apple/391/cigar_1f6ac.png" },
      { name: "Party Sparkler", img: "https://em-content.zobj.net/source/apple/391/sparkles_2728.png" },
      { name: "Lol Pop", img: "https://em-content.zobj.net/source/apple/391/lollipop_1f36d.png" },
      { name: "Desk Calendar", img: "https://em-content.zobj.net/source/apple/391/spiral-calendar_1f5d3-fe0f.png" }
    ];
    const backdrops = ["Red", "Dark", "Gold", "Purple"];
    const patterns = ["None", "Stars", "Waves"];

    // Генерируем 300 уникальных подарков
    function generateDatabase() {
      for(let i=1; i<=300; i++) {
        const col = collections[Math.floor(Math.random() * collections.length)];
        const tonPrice = parseFloat((Math.random() * 200 + 1).toFixed(1));
        const starsPrice = Math.round((tonPrice * tonUsdRate) / starUsdRate);
        const status = Math.random() > 0.3 ? 'sale' : 'auction';

        allGifts.push({
          id: i,
          name: col.name,
          img: col.img,
          num: "#" + Math.floor(Math.random() * 999999 + 100),
          ton: tonPrice,
          stars: starsPrice,
          status: status,
          bg: backdrops[Math.floor(Math.random() * backdrops.length)],
          pat: patterns[Math.floor(Math.random() * patterns.length)]
        });
      }
      filteredGifts = [...allGifts];
      applyFilters();
    }

    function toggleFilters() {
      document.getElementById('filtersPanel').classList.toggle('show');
      document.getElementById('filterToggle').classList.toggle('active');
    }

    function setCurrency(mode) {
      currentCurrency = mode;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + mode).classList.add('active');
      renderPage();
    }

    function applyFilters() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const sort = document.getElementById("sortSelect").value;
      const col = document.getElementById("collectionSelect").value;

      filteredGifts = allGifts.filter(g => {
        const matchQ = g.name.toLowerCase().includes(q) || g.num.includes(q);
        const matchCol = col === 'all' || g.name === col;
        return matchQ && matchCol;
      });

      filteredGifts.sort((a, b) => sort === 'asc' ? a.ton - b.ton : b.ton - a.ton);
      currentPage = 1; // Сбрасываем на первую страницу при фильтрации
      renderPage();
    }

    function renderPage() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const pageItems = filteredGifts.slice(start, end);

      pageItems.forEach(g => {
        const statusBadge = g.status === 'sale' 
          ? `<div class="badge-status bg-sale">На продаже</div>` 
          : `<div class="badge-status bg-auction">Аукцион</div>`;

        let priceHtml = "";
        if(currentCurrency === 'all') priceHtml = `<div class="p-ton">💎 ${g.ton}</div><div class="p-star">⭐️ ${g.stars.toLocaleString()}</div>`;
        else if(currentCurrency === 'ton') priceHtml = `<div class="p-ton">💎 ${g.ton} TON</div>`;
        else priceHtml = `<div class="p-star">⭐️ ${g.stars.toLocaleString()} Звёзд</div>`;

        grid.innerHTML += `
          <div class="item-card">
            <div class="item-img-wrap">
              <img src="${g.img}" alt="${g.name}">
              <div class="badge-serial">${g.num}</div>
              ${statusBadge}
            </div>
            <div class="item-body">
              <div class="item-title">${g.name}</div>
              <div class="item-attrs">
                <span>Bg: ${g.bg}</span>
                <span>Pt: ${g.pat}</span>
              </div>
              <div class="item-price">${priceHtml}</div>
              <button class="buy-btn" onclick="tg.openTelegramLink('https://t.me/nft')">Купить</button>
            </div>
          </div>
        `;
      });
      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(filteredGifts.length / itemsPerPage);
      const pag = document.getElementById("pagination");
      pag.innerHTML = "";

      if (totalPages <= 1) return;

      // Кнопка Назад
      pag.innerHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>&laquo;</button>`;

      // Номера страниц (показываем соседние)
      for(let i = Math.max(1, currentPage - 1); i <= Math.min(totalPages, currentPage + 2); i++) {
        pag.innerHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
      }

      // Кнопка Вперед
      pag.innerHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>&raquo;</button>`;
    }

    function changePage(page) {
      const totalPages = Math.ceil(filteredGifts.length / itemsPerPage);
      if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderPage();
        window.scrollTo({ top: 0, behavior: 'smooth' }); // Плавный скролл наверх
      }
    }

    document.getElementById("searchInput").addEventListener("input", applyFilters);
    
    generateDatabase();
  </script>
</body>
</html>
