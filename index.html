<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RDSTR Market</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #131822;
      --border: #1f2736;
      --accent: #0098ea;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --star-color: #ffb800;
      --ton-color: #0098ea;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 14px; -webkit-tap-highlight-color: transparent; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .brand { font-size: 19px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
    .brand span { color: var(--accent); }
    .security-badge {
      font-size: 11px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .rate-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 10px; margin-bottom: 12px;
      font-size: 12px; color: var(--text-muted);
    }
    .rate-bar b { color: var(--text-main); }

    .controls-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-box {
      flex: 1; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 12px; color: #fff; font-size: 13px; outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .add-btn {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--accent);
      border-radius: 10px; padding: 0 13px; font-size: 18px; font-weight: 700; cursor: pointer;
    }

    .add-modal {
      display: none; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; margin-bottom: 14px;
    }
    .add-modal input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 9px 10px; color: #fff; font-size: 12px; margin-bottom: 8px; outline: none;
    }
    .add-modal button {
      width: 100%; background: var(--accent); color: #fff; border: none;
      padding: 9px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer;
    }

    .currency-switch { display: flex; gap: 8px; margin-bottom: 14px; }
    .curr-btn {
      flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card-bg); color: var(--text-muted); font-size: 12px; font-weight: 600;
      cursor: pointer; text-align: center; transition: 0.15s;
    }
    .curr-btn.active { background: rgba(0, 152, 234, 0.15); color: #fff; border-color: var(--accent); }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .item-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s;
    }
    .item-img-wrap {
      width: 100%; aspect-ratio: 1 / 1; background: #0f131c;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .item-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .serial-tag {
      position: absolute; top: 8px; right: 8px; background: rgba(11, 14, 20, 0.78);
      backdrop-filter: blur(4px); color: #fff; font-size: 10px; font-weight: 700;
      padding: 3px 7px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
    }
    .item-body { padding: 10px; display: flex; flex-direction: column; flex: 1; }
    .item-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .item-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .item-price-wrap {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border);
    }
    .price-ton { color: var(--ton-color); font-weight: 800; font-size: 13px; }
    .price-stars { color: var(--star-color); font-weight: 700; font-size: 11px; }

    .buy-btn {
      margin-top: 8px; width: 100%; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; padding: 8px 0; font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .loader { font-size: 11px; color: var(--text-muted); text-align: center; padding: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">RDSTR <span>MARKET</span></div>
    <div class="security-badge">🛡 TON SECURITY</div>
  </header>

  <div class="rate-bar">
    <span>Живой курс TON: <b id="tonRateText">Загрузка...</b></span>
    <span>1 Star ≈ <b>$0.015</b></span>
  </div>

  <div class="controls-row">
    <input type="text" id="searchInput" class="search-box" placeholder="Поиск по названию или #номеру...">
    <button class="add-btn" onclick="toggleAddModal()" title="Спарсить подарок по ссылке">+</button>
  </div>

  <div class="add-modal" id="addModal">
    <input type="text" id="customUrl" placeholder="Ссылка (напр. https://t.me/nft/SnoopCigar-111723)">
    <input type="number" id="customTon" placeholder="Цена в TON (напр. 14.5)">
    <button onclick="addCustomGift()">Спарсить с Telegram и добавить</button>
  </div>

  <div class="currency-switch">
    <div class="curr-btn active" id="filterAll" onclick="setFilter('all')">TON + Звёзды</div>
    <div class="curr-btn" id="filterTon" onclick="setFilter('ton')">💎 Только TON</div>
    <div class="curr-btn" id="filterStars" onclick="setFilter('stars')">⭐️ Только Звёзды</div>
  </div>

  <div class="grid" id="itemsGrid"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let tonUsdRate = 5.20; // Дефолтный курс, обновляется с биржи при старте
    const starUsdRate = 0.015;
    let currentMode = 'all';

    // Реальные ссылки на существующие NFT-подарки в Telegram
    const initialSources = [
      { url: "https://t.me/nft/SnoopCigar-111723", ton: 14.5 },
      { url: "https://t.me/nft/PartySparkler-152734", ton: 8.2 },
      { url: "https://t.me/nft/LolPop-46490", ton: 4.8 },
      { url: "https://t.me/nft/DeskCalendar-165444", ton: 6.5 },
      { url: "https://t.me/nft/LolPop-258657", ton: 5.1 },
      { url: "https://t.me/nft/HomemadeCake-10421", ton: 11.0 },
      { url: "https://t.me/nft/PlushPepe-1420", ton: 420.0 },
      { url: "https://t.me/nft/DurovsCap-882", ton: 195.0 }
    ];

    let parsedGifts = [];

    // 1. Получаем реальный курс TON через публичный API TonAPI / CoinGecko
    async function fetchLiveTonPrice() {
      try {
        const res = await fetch("https://tonapi.io/v2/rates?tokens=ton&currencies=usd");
        const data = await res.json();
        if (data?.rates?.TON?.prices?.USD) {
          tonUsdRate = parseFloat(data.rates.TON.prices.USD);
          document.getElementById("tonRateText").innerText = "$" + tonUsdRate.toFixed(2);
        }
      } catch (e) {
        document.getElementById("tonRateText").innerText = "$" + tonUsdRate.toFixed(2);
      }
    }

    // 2. Парсим реальную страницу подарка https://t.me/nft/... (картинка, имя, номер, модель)
    async function parseTelegramGift(item) {
      const slug = item.url.split("/nft/")[1] || "Gift-1";
      const [rawName, rawNum] = slug.split("-");
      const fallbackTitle = rawName.replace(/([A-Z])/g, ' $1').trim();

      let giftData = {
        url: item.url,
        name: fallbackTitle,
        num: "#" + (rawNum || "1"),
        image: "",
        model: "Telegram Collectible",
        ton: item.ton,
        stars: Math.round((item.ton * tonUsdRate) / starUsdRate)
      };

      try {
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(item.url);
        const html = await fetch(proxyUrl).then(r => r.text());
        const doc = new DOMParser().parseFromString(html, "text/html");

        const ogTitle = doc.querySelector("meta[property='og:title']")?.content;
        const ogImage = doc.querySelector("meta[property='og:image']")?.content;
        const ogDesc = doc.querySelector("meta[property='og:description']")?.content;

        if (ogTitle) {
          const parts = ogTitle.split("#");
          giftData.name = parts[0].trim();
          if (parts[1]) giftData.num = "#" + parts[1].trim();
        }
        if (ogImage) {
          giftData.image = ogImage;
        }
        if (ogDesc) {
          const firstLine = ogDesc.split("\n")[0];
          if (firstLine) giftData.model = firstLine;
        }
      } catch (err) {
        console.warn("Proxy fallback for", item.url);
      }

      return giftData;
    }

    function renderGrid() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const grid = document.getElementById("itemsGrid");
      grid.innerHTML = "";

      parsedGifts
        .filter(g => g.name.toLowerCase().includes(q) || g.num.toLowerCase().includes(q))
        .forEach(g => {
          const starsCalc = Math.round((g.ton * tonUsdRate) / starUsdRate);
          const card = document.createElement("div");
          card.className = "item-card";

          let priceBlock = "";
          if (currentMode === 'all') {
            priceBlock = `
              <div class="price-ton">💎 ${g.ton} TON</div>
              <div class="price-stars">⭐️ ${starsCalc.toLocaleString()}</div>
            `;
          } else if (currentMode === 'ton') {
            priceBlock = `<div class="price-ton">💎 ${g.ton} TON ($${(g.ton * tonUsdRate).toFixed(1)})</div>`;
          } else {
            priceBlock = `<div class="price-stars">⭐️ ${starsCalc.toLocaleString()} Звёзд</div>`;
          }

          const imgElement = g.image
            ? `<img src="${g.image}" alt="${g.name}" loading="lazy">`
            : `<div class="loader">Загрузка 3D...</div>`;

          card.innerHTML = `
            <div class="item-img-wrap">
              ${imgElement}
              <div class="serial-tag">${g.num}</div>
            </div>
            <div class="item-body">
              <div class="item-title">${g.name}</div>
              <div class="item-sub">${g.model}</div>
              <div class="item-price-wrap">${priceBlock}</div>
              <button class="buy-btn" onclick="openGift('${g.url}')">Открыть в Telegram</button>
            </div>
          `;
          grid.appendChild(card);
        });
    }

    function setFilter(mode) {
      currentMode = mode;
      document.querySelectorAll('.curr-btn').forEach(b => b.classList.remove('active'));
      if (mode === 'all') document.getElementById('filterAll').classList.add('active');
      if (mode === 'ton') document.getElementById('filterTon').classList.add('active');
      if (mode === 'stars') document.getElementById('filterStars').classList.add('active');
      renderGrid();
    }

    function toggleAddModal() {
      const m = document.getElementById("addModal");
      m.style.display = m.style.display === "block" ? "none" : "block";
    }

    async function addCustomGift() {
      const url = document.getElementById("customUrl").value.trim();
      const ton = parseFloat(document.getElementById("customTon").value);
      if (!url.startsWith("https://t.me/nft/") || isNaN(ton)) {
        alert("Введите корректную ссылку https://t.me/nft/... и цену в TON");
        return;
      }
      toggleAddModal();
      const newGift = await parseTelegramGift({ url, ton });
      parsedGifts.unshift(newGift);
      renderGrid();
    }

    function openGift(url) {
      tg.openTelegramLink(url);
    }

    document.getElementById("searchInput").addEventListener("input", renderGrid);

    async function initApp() {
      await fetchLiveTonPrice();
      // Сначала рендерим каркас, затем подгружаем реальные картинки из Telegram
      parsedGifts = initialSources.map(s => {
        const slug = s.url.split("/nft/")[1] || "Gift-1";
        const [n, num] = slug.split("-");
        return {
          url: s.url,
          name: n.replace(/([A-Z])/g, ' $1').trim(),
          num: "#" + num,
          image: "",
          model: "Синхронизация с t.me...",
          ton: s.ton
        };
      });
      renderGrid();

      for (let i = 0; i < initialSources.length; i++) {
        parsedGifts[i] = await parseTelegramGift(initialSources[i]);
        renderGrid();
      }
    }

    initApp();
  </script>
</body>
</html>
